[package]
name = "quick-easyconnect-proxy"
version = "0.1.0"
description = "EasyConnect client running in Docker isolation"
authors = ["you"]
edition = "2021"

[lib]
name = "quick_easyconnect_proxy_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
which = "6"
tokio-tungstenite = "0.21"
futures-util = "0.3"
keyring = "2"
dirs = "5"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-socks = "0.5"
regex = "1"
chrono = "0.4"
